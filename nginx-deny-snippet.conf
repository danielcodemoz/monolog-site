# Extra para colar no server { } do Nginx (o site já tem um nginx noutra pasta).
# Não é um server completo — só os bloqueios e o /editar.

# Não listar ficheiros da pasta (editar.php não aparece num índice):
autoindex off;

# Palavra-passe do editor — nunca servir:
location = /editor-secret.php { deny all; return 404; }

# Notas PHP e este snippet:
location = /.user.ini { deny all; return 404; }
location = /nginx-deny-snippet.conf { deny all; return 404; }

# EDITOR-PASSWORD.txt NÃO está dentro de website/. Mesmo assim:
location ~* EDITOR-PASSWORD { deny all; return 404; }

# URL bonita, mesma página:
location = /editar { rewrite ^ /editar.php last; }
